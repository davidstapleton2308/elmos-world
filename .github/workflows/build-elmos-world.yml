name: Build Elmos World 3.1.1

on:
  push:
    branches: [main]
    paths:
      - "ElmosWorld_3_1_1_GitHub_Ready.zip"
      - ".github/workflows/build-elmos-world.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish v3.1.1 after you have tested a Windows build"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          $zip = 'ElmosWorld_3_1_1_GitHub_Ready.zip'
          if (!(Test-Path $zip)) { throw "Upload $zip to the repository root before running Actions." }
          Expand-Archive -LiteralPath $zip -DestinationPath extracted -Force
          $source = Join-Path 'extracted' 'ElmosWorld_3.1.1'
          if (!(Test-Path (Join-Path $source 'build/ElmosWorld.spec'))) { throw 'Missing expected source folder in archive.' }
          Get-ChildItem -LiteralPath $source -Force | Copy-Item -Destination . -Recurse -Force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Run included project checks
        shell: pwsh
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Project checks failed.' }

      - name: Install dependencies and build standalone executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r build/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/ElmosWorld.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path 'dist/ElmosWorld/ElmosWorld.exe')) { throw 'Missing executable.' }

      - name: Smoke test bundled executable
        shell: pwsh
        run: |
          & '.\dist\ElmosWorld\ElmosWorld.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Executable self-test failed.' }

      - name: Install Inno Setup and build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc 'build/ElmosWorld.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          if (!(Test-Path 'dist_setup/ElmosWorld_Setup_3.1.1.exe')) { throw 'Installer missing.' }

      - name: Create checksum and portable archive
        shell: pwsh
        run: |
          $exe = 'dist_setup/ElmosWorld_Setup_3.1.1.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$exe.sha256" -Value "$hash  ElmosWorld_Setup_3.1.1.exe" -Encoding ascii
          Compress-Archive -Path 'dist/ElmosWorld/*' -DestinationPath 'dist_setup/ElmosWorld_Portable_3.1.1.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-v3.1.1-Windows
          path: |
            dist_setup/ElmosWorld_Setup_3.1.1.exe
            dist_setup/ElmosWorld_Setup_3.1.1.exe.sha256
            dist_setup/ElmosWorld_Portable_3.1.1.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish release (optional)
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.1 "dist_setup/ElmosWorld_Setup_3.1.1.exe" "dist_setup/ElmosWorld_Setup_3.1.1.exe.sha256" "dist_setup/ElmosWorld_Portable_3.1.1.zip" --target "${{ github.sha }}" --title "Elmos World 3.1.1" --notes-file 'RELEASE_NOTES.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
