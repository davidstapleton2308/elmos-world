name: Build and Release Elmos World

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elmos-world-public-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Determine next patch version and prepare release sources
        id: release_version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $all = @(ConvertFrom-Json -InputObject $json)
          $versions = @(
            $all | ForEach-Object {
              if ($_.tagName -match '^v(\d+)\.(\d+)\.(\d+)$') {
                [version]($_.tagName.Substring(1))
              }
            }
          )
          if ($versions.Count -gt 0) {
            $last = $versions | Sort-Object -Descending | Select-Object -First 1
            $next = "$($last.Major).$($last.Minor).$($last.Build + 1)"
          } else {
            $baseline = (Get-Content release_manifest.json -Raw | ConvertFrom-Json).version
            $next = $baseline
          }
          "version=$next" >> $env:GITHUB_OUTPUT
          Write-Host "Building Elmos World version $next"
          python build/prepare_version.py "$next"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare release version.' }

      - name: Validate source and release assets
        shell: pwsh
        run: |
          python -m compileall -q app build/prepare_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed.' }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Project tests failed.' }

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r build/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies installation failed.' }

      - name: Compile desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/ElmosWorld.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path dist/ElmosWorld/ElmosWorld.exe)) { throw 'Standalone executable missing.' }

      - name: Verify executable is a genuine GUI application
        shell: pwsh
        run: |
          python build/verify_windows_gui.py dist/ElmosWorld/ElmosWorld.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI subsystem verification failed.' }

      - name: Smoke-test standalone GUI executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/ElmosWorld/ElmosWorld.exe').Path
          $selfTest = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Bundled GUI executable smoke-test failed with exit code $($selfTest.ExitCode)." }

      - name: Preserve executable test diagnostic log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'ElmosWorld/logs/launcher.log'
          if (Test-Path $log) {
            Copy-Item $log diagnostics/launcher.log
          } else {
            Set-Content diagnostics/launcher.log 'No application diagnostic log found.'
          }

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-Diagnostics
          path: diagnostics/launcher.log
          if-no-files-found: warn

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Compile Windows installer
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler missing.' }
          & $iscc build\ElmosWorld.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          if (!(Test-Path $setup)) { throw "Installer missing: $setup" }

      - name: Test real installer through detached update worker
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "dist_setup/ElmosWorld_Setup_$env:VERSION.exe").Path
          $worker = (Resolve-Path 'app/apply_update.ps1').Path
          $log = Join-Path $env:RUNNER_TEMP 'elmos-update-worker.log'
          $status = Join-Path $env:RUNNER_TEMP 'elmos-update-status.json'
          $testApp = Join-Path $env:WINDIR 'System32/whoami.exe'
          # Simulate the race: Elmos World already exited before the worker checks its PID.
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Installer $setup -ParentId 2147483600 -AppExe $testApp -LogPath $log -StatusPath $status
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw 'Detached update worker failed to install the Windows release.'
          }
          $outcome = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
          if ($outcome.state -ne 'complete') { throw "Update worker did not complete: $($outcome.detail)" }
          $installedApp = Join-Path $env:LOCALAPPDATA 'Programs/Elmos World/ElmosWorld.exe'
          if (-not (Test-Path -LiteralPath $installedApp)) { throw "Installer did not install the desktop app: $installedApp" }
          $check = Start-Process -FilePath $installedApp -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Installed application failed its executable self-test.' }
          Write-Host 'PASS: installer worker installed the update and completed.'
      - name: Package portable build and SHA-256 checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          $checksum = "$setup.sha256"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$sha  ElmosWorld_Setup_$env:VERSION.exe" -Encoding ascii
          Compress-Archive -Path 'dist/ElmosWorld/*' -DestinationPath "dist_setup/ElmosWorld_Portable_$env:VERSION.zip" -Force
          $subject = git log -1 --format=%s
          @("Elmos World v$env:VERSION", "", "Changes in this build:", "- $subject", "", "Windows installer, portable ZIP, and SHA-256 checksum are included.", "Run the installer or update through Settings > Update Center.") | Set-Content 'dist_setup/RELEASE_NOTES.md' -Encoding utf8

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-Windows-Setup
          path: dist_setup/
          if-no-files-found: error
          retention-days: 30

      - name: Publish next GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          $checksum = "$setup.sha256"
          $portable = "dist_setup/ElmosWorld_Portable_$env:VERSION.zip"
          gh release create "$tag" "$setup" "$checksum" "$portable" --target "${{ github.sha }}" --title "Elmos World $env:VERSION" --notes-file 'dist_setup/RELEASE_NOTES.md' --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
