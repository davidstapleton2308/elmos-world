name: Build Elmos World Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r build/requirements-windows.txt

      - name: Compile the desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/ElmosWorld.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path dist/ElmosWorld/ElmosWorld.exe)) { throw 'Missing standalone executable.' }

      - name: Smoke-test bundled resources and dependencies
        shell: pwsh
        run: |
          & .\dist\ElmosWorld\ElmosWorld.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Standalone executable smoke test failed.' }

      - name: Preserve standalone smoke-test diagnostics
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'ElmosWorld/logs/launcher.log'
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          if (Test-Path $log) {
            Copy-Item $log diagnostics/launcher.log -Force
          } else {
            Set-Content diagnostics/launcher.log 'The standalone self-test failed without creating its expected diagnostic log.'
          }

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-SmokeTest-Diagnostics
          path: diagnostics/launcher.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'ISCC.exe not found.' }
          & $iscc build\ElmosWorld.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler failed.' }
          if (!(Test-Path dist_setup\ElmosWorld_Setup_3.1.1.exe)) { throw 'Setup artifact missing.' }

      - name: Archive standalone portable application
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/ElmosWorld/*' -DestinationPath 'dist_setup/ElmosWorld_Portable_3.1.1.zip' -Force

      - name: Write installer checksum
        shell: pwsh
        run: |
          $file = 'dist_setup/ElmosWorld_Setup_3.1.1.exe'
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$file.sha256" -Value "$hash  ElmosWorld_Setup_3.1.1.exe" -Encoding ascii

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-v3.1.1-Windows
          path: |
            dist_setup/ElmosWorld_Setup_3.1.1.exe
            dist_setup/ElmosWorld_Setup_3.1.1.exe.sha256
            dist_setup/ElmosWorld_Portable_3.1.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with installer and checksum
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v3.1.1 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v3.1.1 already exists; leaving published assets unchanged.'
            exit 0
          }
          gh release create v3.1.1 'dist_setup/ElmosWorld_Setup_3.1.1.exe' 'dist_setup/ElmosWorld_Setup_3.1.1.exe.sha256' 'dist_setup/ElmosWorld_Portable_3.1.1.zip' --target "${{ github.sha }}" --title 'Elmos World 3.1.1' --notes-file 'RELEASE_NOTES.txt' --repo "${{ github.repository }}"
