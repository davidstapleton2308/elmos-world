name: Build and Release Elmos World

on:
  push:
    branches:
      - main
      - release/unified-auto-input-v3
      - feature/install-prerequisite-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elmos-world-public-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Set up .NET 10 for the virtual-controller bridge
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up .NET 10 for Elmos Input bridge
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine next patch version and prepare release sources
        id: release_version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases.' }
          $all = @(ConvertFrom-Json -InputObject $json)
          $versions = @(
            $all | ForEach-Object {
              if ($_.tagName -match '^v(\d+)\.(\d+)\.(\d+)$') {
                [version]($_.tagName.Substring(1))
              }
            }
          )
          if ($versions.Count -gt 0) {
            $last = $versions | Sort-Object -Descending | Select-Object -First 1
            $next = "$($last.Major).$($last.Minor).$($last.Build + 1)"
          } else {
            $baseline = (Get-Content release_manifest.json -Raw | ConvertFrom-Json).version
            $next = $baseline
          }
          "version=$next" >> $env:GITHUB_OUTPUT
          Write-Host "Building Elmos World version $next"
          python build/prepare_version.py "$next"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare release version.' }

      - name: Validate source and release assets
        shell: pwsh
        run: |
          python -m compileall -q app build controller-lab/elmos_controller_lab
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed.' }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Project tests failed.' }

      - name: Validate frontend JavaScript syntax and discovery UI wiring
        shell: pwsh
        run: |
          node --check app/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Frontend JavaScript contains a syntax error.' }
          node --check app/presets/classic-3.1.1/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Classic preset JavaScript contains a syntax error.' }
          node --check app/presets/unified-3.2/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Unified preset JavaScript contains a syntax error.' }
          python -m unittest discover -s tests -p 'test_smart_discovery*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Smart Discovery regression tests failed.' }

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r build/requirements-windows.txt -r controller-lab/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies installation failed.' }
          python -m pip install --disable-pip-version-check -e "controller-lab[test,sensors]"
          if ($LASTEXITCODE -ne 0) { throw 'Controller Lab dependencies failed.' }
          python -m pytest controller-lab/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Controller Lab tests failed.' }

      - name: Build the verified Elmos Controller Lab bridge
        shell: pwsh
        run: |
          & 'controller-lab/scripts/Build-ControllerLab.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Controller Lab bridge build failed.' }

      - name: Verify read-only installer prerequisite probe without a driver
        shell: pwsh
        run: |
          python -m elmos_controller_lab.lab --bridge 'controller-lab/bridge/publish/Elmos.ControllerLab.Bridge.exe' check-prerequisites
          $probeCode = $LASTEXITCODE
          if ($probeCode -ne 10) { throw "Expected an unprivileged missing-driver result (10), got $probeCode." }

      - name: Build physical-to-virtual Controller Lab bridge
        shell: pwsh
        run: |
          & 'controller-lab/scripts/Build-ControllerLab.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Controller Lab bridge failed to build.' }

      - name: Compile desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/ElmosWorld.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path dist/ElmosWorld/ElmosWorld.exe)) { throw 'Standalone executable missing.' }

      - name: Build standalone elevated controller runtime
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist/controller-runtime --workpath build/controller-runtime-work build/ControllerRuntime.spec
          if ($LASTEXITCODE -ne 0) { throw 'Controller runtime helper build failed.' }
          $bundle = (Resolve-Path 'dist/ElmosWorld').Path
          $internal = Join-Path $bundle '_internal'
          if (!(Test-Path $internal)) { $internal = $bundle }
          $runtime = Join-Path $internal 'controller-runtime'
          $bridge = Join-Path $internal 'controller-lab/bridge/publish'
          New-Item -ItemType Directory -Force -Path $runtime,$bridge | Out-Null
          Copy-Item 'dist/controller-runtime/ElmosControllerRuntime.exe' $runtime -Force
          Copy-Item 'controller-lab/bridge/publish/Elmos.ControllerLab.Bridge.exe' $bridge -Force
          $notices = Join-Path $internal 'controller-lab'
          New-Item -ItemType Directory -Force -Path $notices | Out-Null
          foreach ($name in @('LICENSE','THIRD-PARTY-NOTICES.txt')) {
            $source = Join-Path 'controller-lab/runtime' $name
            if (Test-Path $source) { Copy-Item $source $notices -Force }
          }

      - name: Bundle separate virtual controller runtime
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist/controller-runtime --workpath build/controller-runtime-work build/ControllerRuntime.spec
          if ($LASTEXITCODE -ne 0) { throw 'Virtual controller runtime build failed.' }
          $bundle = (Resolve-Path 'dist/ElmosWorld').Path
          $internal = Join-Path $bundle '_internal'
          if (!(Test-Path $internal)) { $internal = $bundle }
          $runtime = Join-Path $internal 'controller-runtime'
          $bridge = Join-Path $internal 'controller-lab/bridge/publish'
          New-Item -ItemType Directory -Force -Path $runtime,$bridge | Out-Null
          Copy-Item 'dist/controller-runtime/ElmosControllerRuntime.exe' $runtime -Force
          Copy-Item 'controller-lab/bridge/publish/Elmos.ControllerLab.Bridge.exe' $bridge -Force
          $notices = Join-Path $internal 'controller-lab'
          New-Item -ItemType Directory -Force -Path $notices | Out-Null
          foreach ($name in @('LICENSE','THIRD-PARTY-NOTICES.txt')) {
            $source = Join-Path 'controller-lab/runtime' $name
            if (Test-Path $source) { Copy-Item $source $notices -Force }
          }

      - name: Verify executable is a genuine GUI application
        shell: pwsh
        run: |
          python build/verify_windows_gui.py dist/ElmosWorld/ElmosWorld.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI subsystem verification failed.' }

      - name: Verify bundled presets and virtual controller components
        shell: pwsh
        run: |
          $internal = 'dist/ElmosWorld/_internal'
          if (!(Test-Path $internal)) { $internal = 'dist/ElmosWorld' }
          foreach ($path in @('presets/classic-3.1.1/index.html', 'presets/unified-3.2/app.js',
            'controller-runtime/ElmosControllerRuntime.exe', 'controller-lab/bridge/publish/Elmos.ControllerLab.Bridge.exe')) {
            if (!(Test-Path (Join-Path $internal $path))) { throw "Missing packaged component: $path" }
          }

      - name: Smoke-test standalone GUI executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/ElmosWorld/ElmosWorld.exe').Path
          $selfTest = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Bundled GUI executable smoke-test failed with exit code $($selfTest.ExitCode)." }

      - name: Preserve executable test diagnostic log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'ElmosWorld/logs/launcher.log'
          if (Test-Path $log) {
            Copy-Item $log diagnostics/launcher.log
          } else {
            Set-Content diagnostics/launcher.log 'No application diagnostic log found.'
          }

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-Diagnostics
          path: diagnostics/launcher.log
          if-no-files-found: warn

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Check backup script and snapshot manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempDir = Join-Path $env:RUNNER_TEMP 'preupdate-fixture'
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Set-Content (Join-Path $tempDir 'ElmosWorld.exe') 'dummy existing app' -Encoding ASCII
          # The actual in-installer backup is exercised on the second pass
          # of the detached install test below.
          if (!(Test-Path 'build/preinstall_backup.ps1') -or !(Test-Path 'build/restore_previous.ps1')) {
            throw 'Installer recovery resources missing.'
          }

      - name: Compile Windows installer
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler missing.' }
          & $iscc build\ElmosWorld.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          if (!(Test-Path $setup)) { throw "Installer missing: $setup" }

      - name: Test real installer through detached update worker
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "dist_setup/ElmosWorld_Setup_$env:VERSION.exe").Path
          $worker = (Resolve-Path 'app/apply_update.ps1').Path
          $log = Join-Path $env:RUNNER_TEMP 'elmos-update-worker.log'
          $status = Join-Path $env:RUNNER_TEMP 'elmos-update-status.json'
          $testApp = Join-Path $env:WINDIR 'System32/whoami.exe'
          # Simulate the race: Elmos World already exited before the worker checks its PID.
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Installer $setup -ParentId 2147483600 -AppExe $testApp -LogPath $log -StatusPath $status
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw 'Detached update worker failed to install the Windows release.'
          }
          $outcome = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
          if ($outcome.state -ne 'complete') { throw "Update worker did not complete: $($outcome.detail)" }
          $installedApp = Join-Path $env:LOCALAPPDATA 'Programs/Elmos World/ElmosWorld.exe'
          if (-not (Test-Path -LiteralPath $installedApp)) { throw "Installer did not install the desktop app: $installedApp" }
          $check = Start-Process -FilePath $installedApp -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Installed application failed its executable self-test.' }
          # Reinstall the same build with an existing installed app to prove
          # the installer-side backup gate and recovery manifest work.
          $again = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS') -Wait -PassThru
          if ($again.ExitCode -ne 0) { throw "Backup-enabled reinstall failed ($($again.ExitCode))." }
          $backupRoot = Join-Path $env:LOCALAPPDATA 'ElmosWorldRollback'
          $snapshots = @(Get-ChildItem -LiteralPath $backupRoot -Directory -ErrorAction SilentlyContinue)
          $valid = @($snapshots | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'backup-manifest.json') })
          if ($valid.Count -eq 0) { throw 'Installer did not create a rollback backup before reinstalling.' }
          Write-Host 'PASS: installer worker and backup-enabled upgrade both completed.'
      - name: Package portable build and SHA-256 checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          $checksum = "$setup.sha256"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$sha  ElmosWorld_Setup_$env:VERSION.exe" -Encoding ascii
          Compress-Archive -Path 'dist/ElmosWorld/*' -DestinationPath "dist_setup/ElmosWorld_Portable_$env:VERSION.zip" -Force
          $subject = git log -1 --format=%s
          @("Elmos World v$env:VERSION", "", "Changes in this build:", "- Integrated Game Intelligence and controller launch automation", "- Original Classic 3.1.1 appearance preserved as a selectable preset", "- Existing installation and settings backed up before files are replaced", "- Automatic controller profiles for supported games (virtual device driver requires one-time approval)", "- $subject", "", "Windows installer, portable ZIP, and SHA-256 checksum are included.", "Use Settings > Update Center to install after verification. Physical controller compatibility remains experimental.") | Set-Content 'dist_setup/RELEASE_NOTES.md' -Encoding utf8

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElmosWorld-Windows-Setup
          path: dist_setup/
          if-no-files-found: error
          retention-days: 30

      - name: Publish next GitHub release
        if: github.ref != 'refs/heads/feature/install-prerequisite-audit'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $setup = "dist_setup/ElmosWorld_Setup_$env:VERSION.exe"
          $checksum = "$setup.sha256"
          $portable = "dist_setup/ElmosWorld_Portable_$env:VERSION.zip"
          gh release create "$tag" "$setup" "$checksum" "$portable" --target "${{ github.sha }}" --title "Elmos World $env:VERSION" --notes-file 'dist_setup/RELEASE_NOTES.md' --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
